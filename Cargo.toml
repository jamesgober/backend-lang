# =============================================================================
#  R E P S   ·   backend-lang
# =============================================================================
[package]
name    = "backend-lang"
version = "0.3.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Native backend: instruction selection from ir-lang, SSA register allocation with stack maps, and x86-64 emission through isa-lang."

# Keywords (5 max)
keywords = ["backend", "codegen", "register-allocation", "compiler", "lexersketch"]

# Categories
categories = ["compilers", "development-tools"]

# Links
homepage      = "https://github.com/jamesgober/backend-lang"
repository    = "https://github.com/jamesgober/backend-lang"
documentation = "https://docs.rs/backend-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "backend_lang"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
std = ["isa-lang/std", "ir-lang/std"]


# DEPENDENCIES
# #################################
[dependencies]
# The x86-64 encoder and assembler: MIR is lowered to isa-lang instructions,
# which own every byte of the encoding (first-party, from crates.io).
isa-lang = { version = "0.2", default-features = false }
# The SSA IR instruction selection reads (first-party, from crates.io). The
# 2.0 line is a pre-release, so it is pinned exactly.
ir-lang = { version = "=2.0.0-alpha.1", default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"
# Test-only: wraps emitted code into a static ELF executable for the end-to-end run.
object-lang = "0.2"
# Test-only: ir-lang's reference interpreter is the oracle of the
# differential tests and benchmarks.
ir-lang = { version = "=2.0.0-alpha.1", features = ["interp"] }


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
